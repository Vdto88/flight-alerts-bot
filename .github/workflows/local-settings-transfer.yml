name: Transfer local settings securely
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install encryption dependency
        run: pip install cryptography
      - name: Encrypt settings for this computer
        env:
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          PANEL_PASSWORD: ${{ secrets.PANEL_PASSWORD }}
        run: |
          python - <<'PY'
          import base64, json, os
          from pathlib import Path
          from cryptography.hazmat.primitives import hashes, serialization
          from cryptography.hazmat.primitives.asymmetric import padding
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          public = serialization.load_pem_public_key(b'-----BEGIN PUBLIC KEY-----\nMIICIjANBgkqhkiG9w0BAQEFAAOCAg8AMIICCgKCAgEAqmh2QTEOftgNH7W+mdXF\nXmdiwZuihBQ2uJTvRbQtmRm0VY5WBxwzoR8D6VRSKNbWjfXpcHfpyKJ0h5lqYTQI\nB3kEfuAWfNSVncRnoL89kuR72zc5FdgFLV0IHGwHd9bYn1MMHCoZZx8nq2CaTDkQ\nUWKt501UG2c+8Zkjpw6uzUz6zNFmGcsm3UeP3SU9MSVQIEr569sWc+5m8uzAFfQz\n1aBDY+Y3xWyJMSgTIrLzmXwP9/HtV2sQZhopLNlscXRCrjYspsvd19DJI8Jylqzy\nlA/0LLAhoJ1S2b4vCUeMHfgtbs1DV0JRm9RN0RsYX0AFNawpdV0tyiPJUe1M1+9i\npTXPk2HwY36PB/79NlEntZBXEEcXBLSe8tylYhfGQaF+NAnEKkhZcNhZY69WtvlM\n4JX9Efm6aw/bsOj8BZ7tFKxEm+ZPaL/ZtLXaqt9/1xwxAJ/gqqd8EbKgeR8eAO59\nOjAs/GswdzGFYbKZwi1JFbcl5+uMTaUiOf3WunzPKKY2I6RTcFadChGzpWCHOOAZ\nKoH/LgI5DJ84RAdwUCzqXlyXv2z6/JNvIaCmDGKpdllBOf38RwUAVIKnqbdzbGQT\nk24K8A/ar/2cACfgRqCfnOg/y8INhFU4CYi5mY4/PPXGONih3+I/kHNUb/Nst0+i\nonRFN5THvKjIflXlyttf6WkCAwEAAQ==\n-----END PUBLIC KEY-----\n')
          values = {k: os.environ[k] for k in ('TELEGRAM_CHANNEL_ID', 'PANEL_PASSWORD')}
          if not all(values.values()):
              raise SystemExit('Required configuration is missing')
          key, nonce = os.urandom(32), os.urandom(12)
          encrypted_key = public.encrypt(key, padding.OAEP(mgf=padding.MGF1(hashes.SHA256()), algorithm=hashes.SHA256(), label=None))
          payload = AESGCM(key).encrypt(nonce, json.dumps(values).encode(), None)
          Path('local-settings.enc.json').write_text(json.dumps({k: base64.b64encode(v).decode() for k,v in {'key': encrypted_key, 'nonce': nonce, 'ciphertext': payload}.items()}))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: local-settings-encrypted
          path: local-settings.enc.json
          retention-days: 1
