name: Azul cheaper alert

on:
  schedule:
    - cron: "0 11 * * *"      # ~08:00 BRT — long cycle: also searches days 121-180
    - cron: "0 17,23 * * *"   # ~14:00 / 20:00 BRT — short cycles
  workflow_dispatch: {}

concurrency:
  group: azul-alert
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Restore dedup cache
        uses: actions/cache@v4
        with:
          path: data
          key: azul-db-${{ github.run_id }}
          restore-keys: |
            azul-db-

      - name: Restore history from release when the cache is cold
        id: restore_history
        # Also retried when a previous run left the block marker behind: the cached database is
        # then the thin one that run started with, and the release copy must overwrite it.
        if: hashFiles('data/cache.db') == '' || hashFiles('data/.restore_failed') != ''
        continue-on-error: true
        env:
          PANEL_PASSWORD: ${{ secrets.PANEL_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
        run: python scripts/history_backup.py restore

      - name: Run one pass
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          SEARCH_FAR_DATES: ${{ (github.event_name == 'workflow_dispatch' || github.event.schedule == '0 11 * * *') && '1' || '0' }}
        run: python main.py

      - name: Back up history to the release
        id: backup_history
        continue-on-error: true
        env:
          PANEL_PASSWORD: ${{ secrets.PANEL_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
        run: python scripts/history_backup.py backup

      - name: Check snapshot is non-empty
        id: snapshot
        run: |
          python -c "import json, os; deals = (json.load(open('deals.json')).get('deals', []) if os.path.exists('deals.json') else []); open(os.environ['GITHUB_OUTPUT'], 'a').write('has_deals=' + ('true' if deals else 'false') + '\n')"

      - name: Restore promotions state (read-only)
        # Saved hourly by promos.yml; here it is only read, to ship the panel section.
        if: steps.snapshot.outputs.has_deals == 'true'
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: promo_data
          key: promos-state-readonly
          restore-keys: |
            promos-state-

      - name: Encrypt deals and history
        if: steps.snapshot.outputs.has_deals == 'true'
        env:
          PANEL_PASSWORD: ${{ secrets.PANEL_PASSWORD }}
        run: python scripts/encrypt_deals.py

      - name: Assemble site
        if: steps.snapshot.outputs.has_deals == 'true'
        run: |
          mkdir -p _site
          cp web/index.html web/style.css web/app.js web/switch.js _site/
          mkdir -p _site/classic
          cp web/classic/index.html web/classic/style.css web/classic/app.js _site/classic/
          cp deals.enc.json _site/
          if [ -f promos.enc.json ]; then cp promos.enc.json _site/; fi
          mkdir -p _site/history
          if ls history/*.enc.json >/dev/null 2>&1; then cp history/*.enc.json _site/history/; fi

      - name: Upload Pages artifact
        if: steps.snapshot.outputs.has_deals == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        if: steps.snapshot.outputs.has_deals == 'true'
        id: deploy
        uses: actions/deploy-pages@v4
